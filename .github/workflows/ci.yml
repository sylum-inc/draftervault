name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type-check, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # scripts/build-player-pool.mjs imports src/lib/valuation.ts directly
          # and relies on Node stripping the types (unflagged since 22.18), so
          # the major version here is load-bearing, not incidental.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Validate
        run: npm run validate

      # The app is only useful if it builds; type-check does not prove that,
      # because Vite resolves aliases and assets that tsc never sees.
      - name: Build
        run: npm run build

  pool:
    name: Pool builder still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Not a rebuild — that needs a 19MB play-by-play download and does not
      # belong in CI. This only proves the builder still parses and that its
      # import of the shared valuation module resolves, which is the seam most
      # likely to break silently: nothing in the app fails when it does.
      - name: Check the builder loads
        run: node --check scripts/build-player-pool.mjs && node -e "import('./src/lib/valuation.ts').then(m => { if (typeof m.pricePool !== 'function') { throw new Error('valuation module lost pricePool'); } console.log('valuation module loads under Node type stripping'); })"

      - name: Regenerate icons and check they are committed
        run: |
          npm run build:icons
          git diff --exit-code -- public/icons \
            || (echo "public/icons is out of date; run npm run build:icons" && exit 1)
